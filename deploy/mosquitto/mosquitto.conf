# Mosquitto for Power Cord.
#
# Anonymous access is off. Every strip gets its own username and its own topic
# ACL, so a strip that is compromised cannot see or switch its neighbours. On
# hardware that switches mains in someone's home, that is a safety property and
# not a hardening nicety.

persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

# --- TLS listener -------------------------------------------------------------
# Required if the broker is reachable from the internet. Point these at a real
# certificate (Let's Encrypt works; see docs/09-backend-manual.md) and open 8883
# in docker-compose.yml.
#
# listener 8883
# protocol mqtt
# cafile   /mosquitto/config/certs/chain.pem
# certfile /mosquitto/config/certs/cert.pem
# keyfile  /mosquitto/config/certs/privkey.pem

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

max_keepalive 120
log_dest stdout
log_type warning
log_type error
log_type notice
