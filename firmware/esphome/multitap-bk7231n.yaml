# Korean IoT multi-tap — Beken BK7231N (Tuya CB3S / CBU / CB2S module)
#
# ⚠ EVERY PIN BELOW IS A HYPOTHESIS FROM COMMUNITY TEARDOWNS OF SIMILAR
#   HARDWARE. Verify each one against your unit (docs/01, step 5) before
#   flashing. Wrong pins at best do nothing and at worst drive something you
#   did not intend.
#
# Metering is commented out because most units in this class have no metering
# chip, and the CF/CF1/SEL pins collide with the relay pins in the variants
# that do. Enable it only after you have confirmed a BL0937/HLW8012 on the PCB.

substitutions:
  device_name: multitap-01
  friendly_name: "Multi-tap 01"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Relays default to OFF after a power cut. See docs/07 — this is a safety
  # default, not a preference. Change it deliberately or not at all.

bk72xx:
  board: generic-bk7231n-qfn32-tuya

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP for re-provisioning in the field.
  ap:
    ssid: "${device_name} setup"
    password: !secret ap_password

captive_portal:

web_server:
  version: 3
  # Never deploy without auth — the web UI exposes OTA. See docs/07.
  auth:
    username: admin
    password: !secret web_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  birth_message:
    topic: ${device_name}/status
    payload: online
  will_message:
    topic: ${device_name}/status
    payload: offline

switch:
  - platform: gpio
    name: "Outlet 1"
    id: outlet_1
    pin: P7                 # VERIFY
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Outlet 2"
    id: outlet_2
    pin: P8                 # VERIFY
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Outlet 3"
    id: outlet_3
    pin: P14                # VERIFY
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Outlet 4"
    id: outlet_4
    pin: P9                 # VERIFY
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "USB ports"
    id: usb_rail
    pin: P24                # VERIFY — and confirm the USB rail is switchable
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    name: "Master button"
    pin:
      number: P26           # VERIFY
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - lambda: |-
            // Toggle all four outlets together, matching stock behaviour.
            bool any_on = id(outlet_1).state || id(outlet_2).state ||
                          id(outlet_3).state || id(outlet_4).state;
            if (any_on) {
              id(outlet_1).turn_off(); id(outlet_2).turn_off();
              id(outlet_3).turn_off(); id(outlet_4).turn_off();
            } else {
              id(outlet_1).turn_on(); id(outlet_2).turn_on();
              id(outlet_3).turn_on(); id(outlet_4).turn_on();
            }

  # Per-outlet buttons. Pins unknown on most variants — fill in from your
  # fingerprint, then uncomment.
  # - platform: gpio
  #   name: "Button 1"
  #   pin: {number: P6, inverted: true, mode: {input: true, pullup: true}}
  #   on_press: {then: {switch.toggle: outlet_1}}

status_led:
  pin:
    number: P23             # VERIFY
    inverted: true          # active low on most of these boards

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

  # --- Energy metering: enable ONLY if a BL0937/HLW8012 is on the PCB ---
  # The calibration values below are placeholders. Calibrate against a known
  # resistive load and a clamp meter (docs/07) before showing users any number.
  #
  # - platform: hlw8012
  #   model: BL0937
  #   sel_pin: {number: P24, inverted: true}   # VERIFY — collides with USB rail
  #   cf_pin: P7                               # VERIFY — collides with relay 1
  #   cf1_pin: P8                              # VERIFY — collides with relay 2
  #   current_resistor: 0.001 ohm
  #   voltage_divider: 2351
  #   change_mode_every: 3
  #   update_interval: 10s
  #   voltage:
  #     name: "Voltage"
  #   current:
  #     name: "Current"
  #   power:
  #     name: "Power"
  #     id: strip_power
  #
  # - platform: total_daily_energy
  #   name: "Energy today"
  #   power_id: strip_power
  #   unit_of_measurement: kWh
  #   filters:
  #     - multiply: 0.001

text_sensor:
  - platform: libretiny
    version:
      name: "Firmware version"

time:
  - platform: sntp
    id: sntp_time
    # On-device schedules need correct time. Pick servers reachable from Egypt.
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
