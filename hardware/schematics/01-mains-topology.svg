<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="Mains topology of a four-outlet Wi-Fi multi-tap: protective earth and neutral run unswitched to every outlet, live passes through a single metering shunt before splitting to five relays.">
  <title>Mains topology — 4-outlet Wi-Fi multi-tap</title>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44506A"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B4432B"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7789"/></marker>
  </defs>
  <style>
    .t   { font-family: "DejaVu Sans Mono", monospace; fill: #24304A; }
    .b   { font-weight: 700; }
    .s   { font-size: 10px; fill: #5C6880; }
    .box { fill: #F2F5F9; stroke: #44506A; stroke-width: 1.2; }
    .bxl { fill: #FBEDE9; stroke: #B4432B; stroke-width: 1.3; }
    .bxu { fill: #FFF8E6; stroke: #C08A15; stroke-width: 1.3; }
    .w   { stroke: #44506A; stroke-width: 1.4; fill: none; }
    .wl  { stroke: #B4432B; stroke-width: 1.7; fill: none; }
    .wg  { stroke: #6B7789; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .dot { fill: #B4432B; }
  </style>

  <text class="t b" x="16" y="24" font-size="14">Mains topology — 4 outlets + USB rail</text>
  <text class="s" x="16" y="40">Only the live conductor is switched. Metering, where fitted, is upstream of every relay.</text>

  <!-- inlet + riser -->
  <rect class="box" x="16" y="176" width="106" height="54" rx="3"/>
  <text class="t b" x="69" y="199" font-size="11" text-anchor="middle">MAINS IN</text>
  <text class="s" x="69" y="215" text-anchor="middle">CEE 7/7 · 220 V</text>
  <path class="w" d="M122 203 H140"/>
  <path class="w" d="M140 68 V203"/>
  <path class="wl" d="M140 203 V236"/>
  <circle cx="140" cy="68"  r="2.8" fill="#44506A"/>
  <circle cx="140" cy="112" r="2.8" fill="#44506A"/>
  <circle class="dot" cx="140" cy="203" r="2.8"/>
  <text class="t b" x="130" y="72"  font-size="11" text-anchor="end">PE</text>
  <text class="t b" x="130" y="116" font-size="11" text-anchor="end">N</text>
  <text class="t b" x="130" y="207" font-size="11" text-anchor="end" fill="#B4432B">L</text>

  <!-- PE / N buses -->
  <path class="w" d="M140 68 H800" marker-end="url(#a)"/>
  <text class="s" x="156" y="60">PE → earth pin of all four outlets, never switched</text>
  <path class="w" d="M140 112 H800" marker-end="url(#a)"/>
  <text class="s" x="156" y="104">N → neutral of all four outlets, never switched</text>

  <!-- shunt -->
  <path class="wl" d="M140 236 H206"/>
  <rect class="bxl" x="206" y="214" width="150" height="44" rx="3"/>
  <text class="t b" x="281" y="232" font-size="11" text-anchor="middle">SHUNT + BL0937</text>
  <text class="s" x="281" y="248" text-anchor="middle">one meter · whole strip</text>
  <path class="wl" d="M356 236 H784"/>

  <!-- relays / outlets -->
  <g class="t">
    <!-- x centres for five channels -->
    <g>
      <circle class="dot" cx="420" cy="236" r="2.8"/>
      <path class="wl" d="M420 236 V282" marker-end="url(#al)"/>
      <rect class="box" x="386" y="284" width="68" height="32" rx="3"/>
      <text class="b" x="420" y="304" font-size="10.5" text-anchor="middle">RELAY 1</text>
      <path class="wl" d="M434 316 V362" marker-end="url(#al)"/>
      <rect class="box" x="386" y="364" width="68" height="44" rx="3"/>
      <text class="s" x="420" y="384" text-anchor="middle">OUTLET</text>
      <text class="b" x="420" y="399" font-size="11" text-anchor="middle">1</text>
      <path class="wg" d="M406 344 V319" marker-end="url(#ag)"/>
    </g>
    <g>
      <circle class="dot" cx="511" cy="236" r="2.8"/>
      <path class="wl" d="M511 236 V282" marker-end="url(#al)"/>
      <rect class="box" x="477" y="284" width="68" height="32" rx="3"/>
      <text class="b" x="511" y="304" font-size="10.5" text-anchor="middle">RELAY 2</text>
      <path class="wl" d="M525 316 V362" marker-end="url(#al)"/>
      <rect class="box" x="477" y="364" width="68" height="44" rx="3"/>
      <text class="s" x="511" y="384" text-anchor="middle">OUTLET</text>
      <text class="b" x="511" y="399" font-size="11" text-anchor="middle">2</text>
      <path class="wg" d="M497 344 V319" marker-end="url(#ag)"/>
    </g>
    <g>
      <circle class="dot" cx="602" cy="236" r="2.8"/>
      <path class="wl" d="M602 236 V282" marker-end="url(#al)"/>
      <rect class="box" x="568" y="284" width="68" height="32" rx="3"/>
      <text class="b" x="602" y="304" font-size="10.5" text-anchor="middle">RELAY 3</text>
      <path class="wl" d="M616 316 V362" marker-end="url(#al)"/>
      <rect class="box" x="568" y="364" width="68" height="44" rx="3"/>
      <text class="s" x="602" y="384" text-anchor="middle">OUTLET</text>
      <text class="b" x="602" y="399" font-size="11" text-anchor="middle">3</text>
      <path class="wg" d="M588 344 V319" marker-end="url(#ag)"/>
    </g>
    <g>
      <circle class="dot" cx="693" cy="236" r="2.8"/>
      <path class="wl" d="M693 236 V282" marker-end="url(#al)"/>
      <rect class="box" x="659" y="284" width="68" height="32" rx="3"/>
      <text class="b" x="693" y="304" font-size="10.5" text-anchor="middle">RELAY 4</text>
      <path class="wl" d="M707 316 V362" marker-end="url(#al)"/>
      <rect class="box" x="659" y="364" width="68" height="44" rx="3"/>
      <text class="s" x="693" y="384" text-anchor="middle">OUTLET</text>
      <text class="b" x="693" y="399" font-size="11" text-anchor="middle">4</text>
      <path class="wg" d="M679 344 V319" marker-end="url(#ag)"/>
    </g>
    <g>
      <circle class="dot" cx="784" cy="236" r="2.8"/>
      <path class="wl" d="M784 236 V282" marker-end="url(#al)"/>
      <rect class="bxu" x="750" y="284" width="68" height="32" rx="3"/>
      <text class="b" x="784" y="304" font-size="10.5" text-anchor="middle">RELAY 5</text>
      <path class="wl" d="M798 316 V362" marker-end="url(#al)"/>
      <rect class="bxu" x="750" y="364" width="68" height="44" rx="3"/>
      <text class="s" x="784" y="384" text-anchor="middle">USB</text>
      <text class="s" x="784" y="398" text-anchor="middle">RAIL</text>
      <path class="wg" d="M770 344 V319" marker-end="url(#ag)"/>
    </g>
  </g>

  <!-- PSU + module -->
  <circle class="dot" cx="174" cy="236" r="2.8"/>
  <path class="wl" d="M174 236 V276" marker-end="url(#al)"/>
  <rect class="box" x="108" y="278" width="132" height="42" rx="3"/>
  <text class="t b" x="174" y="295" font-size="10.5" text-anchor="middle">AC–DC</text>
  <text class="s" x="174" y="310" text-anchor="middle">5 V / 3.3 V</text>
  <path class="w" d="M174 320 V334" marker-end="url(#a)"/>
  <rect class="box" x="108" y="336" width="132" height="44" rx="3"/>
  <text class="t b" x="174" y="354" font-size="10.5" text-anchor="middle">Wi-Fi MODULE</text>
  <text class="s" x="174" y="369" text-anchor="middle">BK7231N / ESP8285</text>
  <path class="wg" d="M240 344 H770"/>
  <text class="s" x="252" y="358">GPIO — one pin per relay</text>

  <!-- caveat -->
  <path class="w" d="M420 408 V424" stroke-dasharray="3 3"/>
  <text class="t" x="386" y="440" font-size="10.5" fill="#B4432B">An outlet switched “off” has live interrupted — neutral stays connected.</text>
  <text class="s" x="386" y="454">Single-pole isolation. Never treat an “off” outlet as safe to work on.</text>

  <path class="wl" d="M16 428 H50"/><text class="s" x="56" y="432">mains</text>
  <path class="wg" d="M16 448 H50"/><text class="s" x="56" y="452">logic</text>
</svg>
