<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img"
     aria-label="BL0937 metering front end: a low-value shunt in the live conductor senses current, a high-value divider senses voltage, and the chip emits pulse trains whose frequency is proportional to power and to the multiplexed voltage or current.">
  <title>Energy metering front end (BL0937 / HLW8012)</title>
  <rect width="940" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44506A"/></marker>
  </defs>
  <style>
    .t{font-family:"DejaVu Sans Mono",monospace;fill:#24304A}
    .b{font-weight:700}
    .s{font-size:10px;fill:#5C6880}
    .box{fill:#F2F5F9;stroke:#44506A;stroke-width:1.2}
    .bxl{fill:#FBEDE9;stroke:#B4432B;stroke-width:1.3}
    .w{stroke:#44506A;stroke-width:1.4;fill:none}
    .wl{stroke:#B4432B;stroke-width:1.7;fill:none}
    .wd{stroke:#44506A;stroke-width:1.1;fill:none;stroke-dasharray:3 2}
  </style>

  <text class="t b" x="16" y="24" font-size="14">Metering front end — BL0937 / HLW8012</text>
  <text class="s" x="16" y="40">Fitted on some units only. No shunt near the inlet means the strip cannot measure, and the energy features do not apply.</text>

  <text class="t b" x="20" y="104" font-size="11" fill="#B4432B">L in</text>
  <path class="wl" d="M52 100 H150"/>
  <rect class="bxl" x="150" y="86" width="90" height="28" rx="2"/>
  <text class="s" x="195" y="104" text-anchor="middle">shunt 1 mΩ</text>
  <path class="wl" d="M240 100 H430"/>
  <text class="s" x="352" y="92">→ to the relays</text>

  <text class="t b" x="20" y="204" font-size="11">N</text>
  <path class="w" d="M52 200 H430"/>

  <!-- voltage divider -->
  <path class="w" d="M300 100 V140"/>
  <rect class="box" x="278" y="140" width="44" height="22" rx="2"/>
  <text class="s" x="270" y="156" text-anchor="end">divider ≈ 2000:1</text>
  <path class="w" d="M300 162 V200"/>
  <circle cx="300" cy="200" r="2.6" fill="#44506A"/>

  <!-- sense lines -->
  <path class="wd" d="M240 118 H470"/>
  <text class="s" x="252" y="132">current sense</text>
  <path class="wd" d="M322 151 H470"/>
  <text class="s" x="400" y="146">voltage sense</text>

  <!-- chip -->
  <rect class="box" x="470" y="86" width="150" height="112" rx="3"/>
  <text class="t b" x="545" y="122" font-size="12" text-anchor="middle">BL0937</text>
  <text class="s" x="545" y="140" text-anchor="middle">V1  V2  VP</text>

  <!-- outputs -->
  <path class="w" d="M620 112 H796" marker-end="url(#a3)"/>
  <text class="t b" x="628" y="106" font-size="11">CF</text>
  <text class="s" x="656" y="106">pulses ∝ active power</text>
  <path class="w" d="M620 148 H796" marker-end="url(#a3)"/>
  <text class="t b" x="628" y="142" font-size="11">CF1</text>
  <text class="s" x="660" y="142">∝ current or voltage</text>
  <path class="w" d="M796 184 H622" marker-end="url(#a3)"/>
  <text class="t b" x="628" y="178" font-size="11">SEL</text>
  <text class="s" x="662" y="178">selects CF1 source</text>

  <rect class="box" x="798" y="86" width="124" height="112" rx="3"/>
  <text class="t b" x="860" y="134" font-size="11" text-anchor="middle">Wi-Fi</text>
  <text class="t b" x="860" y="150" font-size="11" text-anchor="middle">MODULE</text>

  <text class="s" x="16" y="234">CF1 is multiplexed, so firmware toggles SEL and waits — which is why voltage and current lag power by a few seconds.</text>
  <text class="s" x="16" y="252">Pulse frequency tracks power and not mains frequency, so moving a strip from 60 Hz Korea to 50 Hz Egypt does not shift the reading.</text>
  <text class="s" x="16" y="270">What does shift it is shunt and divider tolerance, plus a factory calibration done on another bench years ago.</text>
  <text class="s" x="16" y="288" fill="#B4432B">Calibrate each unit against a known resistive load and a clamp meter before showing anyone a kWh figure. See docs/07.</text>
  <text class="s" x="16" y="312">The shunt sits before the relays: one meter for the whole strip. Per-outlet energy is not measurable on this hardware.</text>
</svg>
