<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"
     aria-label="Software architecture: strips connect outbound to an MQTT broker; the Power Cord server bridges MQTT to a REST and WebSocket API and serves the web app; the phone reaches the server on the LAN, or over the internet when the server runs on a VPS.">
  <title>Software architecture and where remote access comes from</title>
  <rect width="900" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44506A"/></marker>
  </defs>
  <style>
    .t{font-family:"DejaVu Sans Mono",monospace;fill:#24304A}
    .b{font-weight:700}
    .s{font-size:10px;fill:#5C6880}
    .box{fill:#F2F5F9;stroke:#44506A;stroke-width:1.2}
    .bxg{fill:#EDF7F2;stroke:#1F7A5C;stroke-width:1.4}
    .w{stroke:#44506A;stroke-width:1.4;fill:none}
    .zone{fill:none;stroke:#9AA6BB;stroke-width:1;stroke-dasharray:6 4}
  </style>

  <text class="t b" x="16" y="24" font-size="14">Architecture — and the only thing that changes for remote access</text>
  <text class="s" x="16" y="40">Every connection is outbound from the device. Nothing needs a port forward, which is what makes this work behind CGNAT.</text>

  <rect class="zone" x="16" y="58" width="450" height="252" rx="8"/>
  <text class="s" x="28" y="76">HOME NETWORK</text>

  <rect class="box" x="36" y="92" width="132" height="52" rx="3"/>
  <text class="t b" x="102" y="114" font-size="11" text-anchor="middle">STRIP 1</text>
  <text class="s" x="102" y="130" text-anchor="middle">OpenBeken</text>
  <rect class="box" x="36" y="160" width="132" height="52" rx="3"/>
  <text class="t b" x="102" y="182" font-size="11" text-anchor="middle">STRIP 2</text>
  <text class="s" x="102" y="198" text-anchor="middle">OpenBeken</text>
  <rect class="box" x="36" y="228" width="132" height="52" rx="3"/>
  <text class="t b" x="102" y="250" font-size="11" text-anchor="middle">STRIP n</text>
  <text class="s" x="102" y="266" text-anchor="middle">ESPHome</text>

  <text class="s" x="180" y="112">MQTT · outbound · TLS on 8883</text>
  <path class="w" d="M168 124 H288" marker-end="url(#a4)"/>
  <path class="w" d="M168 186 H288" marker-end="url(#a4)"/>
  <path class="w" d="M168 254 H288" marker-end="url(#a4)"/>

  <rect class="bxg" x="290" y="152" width="150" height="72" rx="3"/>
  <text class="t b" x="365" y="182" font-size="11" text-anchor="middle">MOSQUITTO</text>
  <text class="s" x="365" y="198" text-anchor="middle">per-device creds</text>
  <text class="s" x="365" y="212" text-anchor="middle">+ topic ACLs</text>

  <path class="w" d="M440 188 H548" marker-end="url(#a4)"/>
  <text class="s" x="448" y="181">subscribe + publish</text>

  <rect class="bxg" x="550" y="142" width="180" height="92" rx="3"/>
  <text class="t b" x="640" y="170" font-size="12" text-anchor="middle">POWERCORD</text>
  <text class="t b" x="640" y="186" font-size="12" text-anchor="middle">SERVER</text>
  <text class="s" x="640" y="204" text-anchor="middle">Node 22 · SQLite</text>
  <text class="s" x="640" y="220" text-anchor="middle">schedules · energy · auth</text>

  <path class="w" d="M640 234 V314" marker-end="url(#a4)"/>
  <text class="s" x="652" y="264">HTTPS + WebSocket</text>
  <text class="s" x="652" y="278">state pushed, never polled</text>

  <rect class="box" x="550" y="316" width="180" height="56" rx="3"/>
  <text class="t b" x="640" y="340" font-size="11" text-anchor="middle">PHONE / BROWSER</text>
  <text class="s" x="640" y="356" text-anchor="middle">PWA — installable</text>

  <rect class="zone" x="754" y="92" width="132" height="146" rx="8"/>
  <text class="s" x="764" y="110">RUNS EITHER</text>
  <rect class="box" x="766" y="122" width="108" height="46" rx="3"/>
  <text class="s" x="820" y="140" text-anchor="middle">on a Pi at home</text>
  <text class="s" x="820" y="154" text-anchor="middle">LAN only</text>
  <rect class="bxg" x="766" y="178" width="108" height="48" rx="3"/>
  <text class="s" x="820" y="197" text-anchor="middle">on a VPS</text>
  <text class="s" x="820" y="211" text-anchor="middle">reachable anywhere</text>
  <path class="w" d="M730 188 H764" marker-end="url(#a4)"/>

  <text class="s" x="16" y="340">Same binary, same database, same app.</text>
  <text class="s" x="16" y="356">Where you run the server is the entire</text>
  <text class="s" x="16" y="372">remote-access decision.</text>
  <text class="s" x="16" y="396" fill="#1F7A5C">On a VPS the strips keep their own local web UI, so a strip whose broker vanishes still works from its buttons and on the LAN.</text>
  <text class="s" x="16" y="414">That is deliberate: losing a vendor's server is exactly what made these strips useless in the first place.</text>
</svg>
